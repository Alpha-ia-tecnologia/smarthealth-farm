# Smart Health CAHOSP — Frontend · nginx (SPA estático)
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compressão para textos/JS/CSS/JSON/SVG.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/xml
    image/svg+xml font/woff2;

  # Assets com hash no nome (Vite) podem ter cache longo e imutável.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Fallback de SPA: qualquer rota desconhecida cai no index.html (React Router cuida do resto).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O HTML não deve ser cacheado — garante que o usuário sempre pegue o bundle mais novo.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # config.js carrega a URL da API em runtime — nunca cachear, senão trocar a env não reflete.
  location = /config.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Cabeçalhos de segurança básicos.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Não expõe a versão do nginx.
  server_tokens off;
}
